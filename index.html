<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ez Tiers - Minecraft Leaderboards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --secondary: #10b981;
            --accent: #f59e0b;
            --dark-bg: #0f0f23;
            --darker-bg: #0a0a18;
            --card-bg: rgba(30, 30, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0c0;
            --text-muted: #6b6b8a;
            --success: #10b981;
            --danger: #ef4444;
            --glass-bg: rgba(20, 20, 36, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --bg-gradient: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --glow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(90deg, #8b5cf6, #a78bfa, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .logo-icon {
            font-size: 2.5rem;
            color: var(--primary);
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5));
        }
        /* Navigation */
        nav {
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .auth-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

         .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link:hover {
            background: rgba(139, 92, 246, 0.1);
            color: var(--primary);
        }

        .nav-link.active {
            background: rgba(139, 92, 246, 0.2);
            color: var(--primary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 1rem;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 50px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .glass-panel {
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            background-color: var(--glass-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            padding: 2rem;
            box-shadow: var(--card-shadow);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow), var(--glow);
        }

        .mode-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .mode-btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .mode-btn:hover::before {
            left: 100%;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .mode-btn.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .search-container {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 1rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        .search-box:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        .leaderboard-container {
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .leaderboard-header {
            display: grid;
            grid-template-columns: 80px 1fr 200px;
            padding: 1.25rem 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .leaderboard-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .leaderboard-list::-webkit-scrollbar {
            width: 8px;
        }

        .leaderboard-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .leaderboard-list::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .leaderboard-row {
            display: grid;
            grid-template-columns: 80px 1fr 200px;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            align-items: center;
            position: relative;
        }

        .leaderboard-row::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            transition: width 0.5s ease;
        }

        .leaderboard-row:hover::after {
            width: 100%;
        }

        .leaderboard-row:hover {
            background: rgba(255, 255, 255, 0.03);
            transform: scale(1.01);
        }

        .rank {
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .leaderboard-row:hover .rank {
            transform: scale(1.1);
        }

        .rank-1 {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }

        .rank-2 {
            background: linear-gradient(135deg, #d1d5db, #9ca3af);
            color: #1f2937;
            box-shadow: 0 0 10px rgba(156, 163, 175, 0.5);
        }

        .rank-3 {
            background: linear-gradient(135deg, #a16207, #92400e);
            color: white;
            box-shadow: 0 0 10px rgba(146, 64, 14, 0.5);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .leaderboard-row:hover .player-avatar {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .player-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .tier-badge {
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 1px solid transparent;
        }

        .leaderboard-row:hover .tier-badge {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .tier-LT5 {
            background: linear-gradient(135deg, #6b7280, #4b5563);
            color: white;
            border-color: #6b7280;
        }

        .tier-HT5 {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-color: #10b981;
        }

        .tier-LT4 {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-color: #3b82f6;
        }

        .tier-HT4 {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border-color: #8b5cf6;
        }

        .tier-LT3 {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border-color: #f59e0b;
        }

        .tier-HT3 {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border-color: #ef4444;
        }

        .tier-LT2 {
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: white;
            border-color: #ec4899;
        }

        .tier-HT2 {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border-color: #f97316;
        }

        .tier-LT1 {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: white;
            border-color: #eab308;
        }

        .tier-HT1 {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            border-color: #06b6d4;
        }

        .admin-controls {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-controls.active {
            display: block;
        }

        .admin-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .admin-title {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .edit-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .leaderboard-row:hover .edit-btn {
            display: block;
        }

        .edit-btn:hover {
            background: var(--primary);
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: var(--text-primary);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            z-index: 1001;
            transform: translateX(150%);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: var(--success);
        }

        .notification.error {
            background: var(--danger);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .logo {
                font-size: 2.5rem;
            }
            
            .mode-selector {
                gap: 0.5rem;
            }
            
            .mode-btn {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
            
            .leaderboard-header, .leaderboard-row {
                grid-template-columns: 60px 1fr 140px;
                padding: 1rem;
            }
            
            .player-avatar {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            
            .tier-badge {
                font-size: 0.8rem;
                padding: 0.5rem 1rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .leaderboard-header, .leaderboard-row {
                grid-template-columns: 50px 1fr 120px;
                font-size: 0.9rem;
                padding: 0.8rem;
            }
            
            .rank {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }
            
            .player-avatar {
                width: 35px;
                height: 35px;
            }
            
            .player-info {
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
     
    
    <!-- Notification System -->
    <div class="notification" id="notification"></div>
    
    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Login to Ez Tiers</h2>
                <button class="close-modal" id="closeLoginModal">&times;</button>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="your.email@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            <p style="text-align: center; margin-top: 1rem; color: var(--text-muted);">
                Admin access only. Contact system administrator for credentials.
            </p>
        </div>
    </div>
    
    <!-- Edit Player Modal -->
    <div class="modal" id="editPlayerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Edit Player Tier</h2>
                <button class="close-modal" id="closeEditModal">&times;</button>
            </div>
            <form id="editPlayerForm">
                <input type="hidden" id="editPlayerId">
                <div class="form-group">
                    <label class="form-label" for="editPlayerName">Player Name</label>
                    <input type="text" id="editPlayerName" class="form-input" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label" for="editPlayerTier">Tier</label>
                    <select id="editPlayerTier" class="form-select" required>
                        <!-- Tier options will be populated dynamically -->
                    </select>
                </div>
                <div class="action-buttons">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <button type="button" class="btn btn-secondary" id="deletePlayerBtn">
                        <i class="fas fa-trash"></i> Delete Player
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="container">
        <header>
            <div class="logo-container">
                <div>
                    <h1 class="logo">Ez Tiers</h1>
                    <p class="subtitle">Competitive Minecraft Leaderboards</p>
                </div>
            </div>
            <nav>
        <div class="container">
            <div class="nav-container">
                
                <div class="nav-links">
                    <a href="#"class=nav-link><i class="fas fa-home"></i> Home</a>
                    <a href="/leaderboards" class="nav-link active"><i class="fas fa-trophy"></i> Leaderboards</a>
                    <a href="https://discord.gg/faQCsjgZ49" class="nav-link" target="_blank"><i class="fab fa-discord"></i> Discord</a>
                    <a href="/docs" class="nav-link"><i class="fas fa-book"></i> Docs</a>
                    
                </div>
            </div>
        </div>
    </nav>
            
            <div class="auth-section">
                <div class="user-info" id="userInfo" style="display: none;">
                    <div class="user-avatar" id="userAvatar">A</div>
                    <span id="userEmail">admin@eztiers.com</span>
                </div>
                <button class="btn btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <button class="btn btn-secondary" id="logoutBtn" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </header>
        
        <main class="glass-panel">
            <div class="mode-selector">
                <!-- Game mode buttons will be dynamically generated -->
            </div>
            
            <div class="search-container">
                <input type="text" class="search-box" placeholder="Search players..." id="playerSearch">
            </div>
            
            <div class="leaderboard-container">
                <div class="leaderboard-header">
                    <div>Rank</div>
                    <div>Player</div>
                    <div>Tier</div>
                </div>
                
                <div class="leaderboard-list" id="leaderboardList">
                    <div class="loading">Loading leaderboard data...</div>
                </div>
            </div>
            
            <div class="admin-controls" id="adminControls">
                <div class="admin-panel">
                    <h3 class="admin-title"><i class="fas fa-plus-circle"></i> Add New Player</h3>
                    <form id="addPlayerForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="newPlayerName">Player Name</label>
                                <input type="text" id="newPlayerName" class="form-input" placeholder="Enter player name" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="newPlayerTier">Tier</label>
                                <select id="newPlayerTier" class="form-select" required>
                                    <option value="">Select a tier</option>
                                    <!-- Tier options will be populated dynamically -->
                                </select>
                            </div>
                        </div>
                        <div class="action-buttons">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-user-plus"></i> Add Player
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Supabase configuration
        const supabaseUrl = 'https://dkfimhcwiufignzfqnxm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrZmltaGN3aXVmaWduemZxbnhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5OTc3MjQsImV4cCI6MjA3NDU3MzcyNH0.lOtCk4v3fkd1DJfvpqrv-NgyByNhEsaHeL4GEqGrQa8';
        
        // Initialize Supabase client
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // Game modes
        const gameModes = [
            { id: 'sword', name: 'Sword' },
            { id: 'axe', name: 'Axe' },
            { id: 'nethpot', name: 'Nethpot' },
            { id: 'diapot', name: 'Diapot' },
            { id: 'mace', name: 'Mace' },
            { id: 'uhc', name: 'UHC' },
            { id: 'smp', name: 'SMP' },
            { id: 'creeper', name: 'Creeper' },
            { id: 'speedbeast', name: 'Speedbeast' },
            { id: 'bedwars', name: 'BedWars' },
            { id: 'the_bridge', name: 'The Bridge' },
            { id: 'classic', name: 'Classic' },
            { id: 'sumo', name: 'Sumo' }
        ];
        
        // Tier mapping with scores for sorting
        const tiers = {
            'LT5': { name: 'Low Tier 5', score: 1 },
            'HT5': { name: 'High Tier 5', score: 2 },
            'LT4': { name: 'Low Tier 4', score: 3 },
            'HT4': { name: 'High Tier 4', score: 4 },
            'LT3': { name: 'Low Tier 3', score: 5 },
            'HT3': { name: 'High Tier 3', score: 6 },
            'LT2': { name: 'Low Tier 2', score: 7 },
            'HT2': { name: 'High Tier 2', score: 8 },
            'LT1': { name: 'Low Tier 1', score: 9 },
            'HT1': { name: 'High Tier 1', score: 10 }
        };
        
        // Current state
        let currentMode = 'sword';
        let leaderboardData = [];
        let filteredData = [];
        let currentUser = null;
        
        // DOM Elements
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userInfo = document.getElementById('userInfo');
        const userAvatar = document.getElementById('userAvatar');
        const userEmail = document.getElementById('userEmail');
        const loginModal = document.getElementById('loginModal');
        const closeLoginModal = document.getElementById('closeLoginModal');
        const loginForm = document.getElementById('loginForm');
        const adminControls = document.getElementById('adminControls');
        const addPlayerForm = document.getElementById('addPlayerForm');
        const newPlayerTier = document.getElementById('newPlayerTier');
        const playerSearch = document.getElementById('playerSearch');
        const editPlayerModal = document.getElementById('editPlayerModal');
        const closeEditModal = document.getElementById('closeEditModal');
        const editPlayerForm = document.getElementById('editPlayerForm');
        const editPlayerId = document.getElementById('editPlayerId');
        const editPlayerName = document.getElementById('editPlayerName');
        const editPlayerTier = document.getElementById('editPlayerTier');
        const deletePlayerBtn = document.getElementById('deletePlayerBtn');
        const notification = document.getElementById('notification');
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            initParticles();
            renderModeButtons();
            populateTierSelects();
            checkAuthState();
            setupEventListeners();
            loadLeaderboardData(currentMode);
        });
        
        // Initialize particles.js
        function initParticles() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 70, density: { enable: true, value_area: 800 } },
                    color: { value: "#8b5cf6" },
                    shape: { type: "circle" },
                    opacity: { value: 0.3, random: true },
                    size: { value: 3, random: true },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#8b5cf6",
                        opacity: 0.1,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "repulse" },
                        onclick: { enable: true, mode: "push" },
                        resize: true
                    }
                },
                retina_detect: true
            });
        }
        
        // Show notification
        function showNotification(message, type = 'success') {
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // Check if user is already logged in
        async function checkAuthState() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                updateUIForUser();
            }
        }
        
        // Update UI when user logs in
        function updateUIForUser() {
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'flex';
            userInfo.style.display = 'flex';
            adminControls.classList.add('active');
            
            userAvatar.textContent = currentUser.email.charAt(0).toUpperCase();
            userEmail.textContent = currentUser.email;
        }
        
        // Update UI when user logs out
        function updateUIForLogout() {
            loginBtn.style.display = 'flex';
            logoutBtn.style.display = 'none';
            userInfo.style.display = 'none';
            adminControls.classList.remove('active');
            currentUser = null;
        }
        
        // Render game mode buttons
        function renderModeButtons() {
            const modeSelector = document.querySelector('.mode-selector');
            modeSelector.innerHTML = '';
            
            gameModes.forEach(mode => {
                const button = document.createElement('button');
                button.className = `mode-btn ${mode.id === currentMode ? 'active' : ''}`;
                button.textContent = mode.name;
                button.dataset.mode = mode.id;
                button.addEventListener('click', () => switchMode(mode.id));
                modeSelector.appendChild(button);
            });
        }
        
        // Populate tier selects for admin forms
        function populateTierSelects() {
            newPlayerTier.innerHTML = '<option value="">Select a tier</option>';
            editPlayerTier.innerHTML = '<option value="">Select a tier</option>';
            
            for (const [code, tier] of Object.entries(tiers)) {
                const option1 = document.createElement('option');
                option1.value = code;
                option1.textContent = tier.name;
                newPlayerTier.appendChild(option1);
                
                const option2 = document.createElement('option');
                option2.value = code;
                option2.textContent = tier.name;
                editPlayerTier.appendChild(option2);
            }
        }
        
        // Switch between game modes
        function switchMode(mode) {
            currentMode = mode;
            renderModeButtons();
            loadLeaderboardData(mode);
        }
        
        // Load leaderboard data from Supabase
        async function loadLeaderboardData(mode) {
            const leaderboardList = document.getElementById('leaderboardList');
            leaderboardList.innerHTML = '<div class="loading">Loading leaderboard data...</div>';
            
            try {
                // Get the game mode ID
                const { data: gameModeData, error: modeError } = await supabase
                    .from('game_modes')
                    .select('id')
                    .eq('name', mode)
                    .single();
                
                if (modeError) throw modeError;
                
                if (!gameModeData) {
                    leaderboardList.innerHTML = '<div class="no-results">Game mode not found.</div>';
                    return;
                }
                
                const gameModeId = gameModeData.id;
                
                // Get players for this game mode with their tiers
                const { data: playerData, error: playerError } = await supabase
                    .from('player_scores')
                    .select(`
                        id,
                        player_name,
                        tier_id,
                        tiers (code, name, rank_value)
                    `)
                    .eq('game_mode_id', gameModeId)
                    .order('rank_value', { foreignTable: 'tiers', ascending: false });
                
                if (playerError) throw playerError;
                
                // Transform data for display
                leaderboardData = playerData ? playerData.map((player, index) => ({
                    id: player.id,
                    rank: index + 1,
                    playerName: player.player_name,
                    tier: player.tiers.code,
                    tierName: player.tiers.name,
                    tierScore: player.tiers.rank_value
                })) : [];
                
                // Sort by tier score (higher is better)
                leaderboardData.sort((a, b) => b.tierScore - a.tierScore);
                
                // Update ranks after sorting
                leaderboardData = leaderboardData.map((player, index) => {
                    player.rank = index + 1;
                    return player;
                });
                
                filteredData = [...leaderboardData];
                renderLeaderboard();
            } catch (error) {
                console.error('Error loading leaderboard data:', error);
                leaderboardList.innerHTML = '<div class="no-results">Error loading data. Please try again.</div>';
            }
        }
        
        // Render the leaderboard
        function renderLeaderboard() {
            const leaderboardList = document.getElementById('leaderboardList');
            
            if (filteredData.length === 0) {
                leaderboardList.innerHTML = '<div class="no-results">No players found. ' + 
                    (currentUser ? 'Add players using the admin panel below.' : 'Login to add players.') + '</div>';
                return;
            }
            
            leaderboardList.innerHTML = '';
            
            filteredData.forEach(player => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row';
                
                row.innerHTML = `
                    <div class="rank rank-${player.rank <= 3 ? player.rank : ''}">${player.rank}</div>
                    <div class="player-info">
                        <div class="player-avatar">${player.playerName.charAt(0)}</div>
                        <div class="player-name">${player.playerName}</div>
                        ${currentUser ? `<button class="edit-btn" data-player-id="${player.id}" data-player-name="${player.playerName}" data-player-tier="${player.tier}">
                            <i class="fas fa-edit"></i> Edit
                        </button>` : ''}
                    </div>
                    <div class="tier-badge tier-${player.tier}">${player.tierName}</div>
                `;
                
                leaderboardList.appendChild(row);
            });
            
            // Add event listeners to edit buttons if user is logged in
            if (currentUser) {
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const playerId = btn.dataset.playerId;
                        const playerName = btn.dataset.playerName;
                        const playerTier = btn.dataset.playerTier;
                        openEditModal(playerId, playerName, playerTier);
                    });
                });
            }
        }
        
        // Open edit player modal
        function openEditModal(playerId, playerName, playerTier) {
            editPlayerId.value = playerId;
            editPlayerName.value = playerName;
            editPlayerTier.value = playerTier;
            editPlayerModal.classList.add('active');
        }
        
        // Add a new player
        async function addPlayer(playerName, tierCode) {
            try {
                // Get the game mode ID
                const { data: gameModeData, error: modeError } = await supabase
                    .from('game_modes')
                    .select('id')
                    .eq('name', currentMode)
                    .single();
                
                if (modeError) throw modeError;
                
                // Get the tier ID
                const { data: tierData, error: tierError } = await supabase
                    .from('tiers')
                    .select('id')
                    .eq('code', tierCode)
                    .single();
                
                if (tierError) throw tierError;
                
                // Check if player already exists for this game mode
                const { data: existingPlayer, error: checkError } = await supabase
                    .from('player_scores')
                    .select('id')
                    .eq('player_name', playerName)
                    .eq('game_mode_id', gameModeData.id)
                    .single();
                
                if (existingPlayer) {
                    showNotification('Player already exists for this game mode!', 'error');
                    return;
                }
                
                // Insert the new player
                const { data, error } = await supabase
                    .from('player_scores')
                    .insert([
                        {
                            player_name: playerName,
                            game_mode_id: gameModeData.id,
                            tier_id: tierData.id
                        }
                    ])
                    .select();
                
                if (error) throw error;
                
                showNotification('Player added successfully!');
                loadLeaderboardData(currentMode);
                
            } catch (error) {
                console.error('Error adding player:', error);
                showNotification('Error adding player: ' + error.message, 'error');
            }
        }
        
        // Update a player's tier
        async function updatePlayer(playerId, tierCode) {
            try {
                // Get the tier ID
                const { data: tierData, error: tierError } = await supabase
                    .from('tiers')
                    .select('id')
                    .eq('code', tierCode)
                    .single();
                
                if (tierError) throw tierError;
                
                // Update the player
                const { data, error } = await supabase
                    .from('player_scores')
                    .update({ tier_id: tierData.id })
                    .eq('id', playerId)
                    .select();
                
                if (error) throw error;
                
                showNotification('Player updated successfully!');
                loadLeaderboardData(currentMode);
                
            } catch (error) {
                console.error('Error updating player:', error);
                showNotification('Error updating player: ' + error.message, 'error');
            }
        }
        
        // Delete a player
        async function deletePlayer(playerId) {
            try {
                const { data, error } = await supabase
                    .from('player_scores')
                    .delete()
                    .eq('id', playerId);
                
                if (error) throw error;
                
                showNotification('Player deleted successfully!');
                loadLeaderboardData(currentMode);
                
            } catch (error) {
                console.error('Error deleting player:', error);
                showNotification('Error deleting player: ' + error.message, 'error');
            }
        }
        
        // Set up event listeners
        function setupEventListeners() {
            // Login button
            loginBtn.addEventListener('click', () => {
                loginModal.classList.add('active');
            });
            
            // Close login modal
            closeLoginModal.addEventListener('click', () => {
                loginModal.classList.remove('active');
            });
            
            // Login form submission
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    showNotification('Login failed: ' + error.message, 'error');
                } else {
                    currentUser = data.user;
                    updateUIForUser();
                    loginModal.classList.remove('active');
                    loginForm.reset();
                    showNotification('Login successful!');
                }
            });
            
            // Logout button
            logoutBtn.addEventListener('click', async () => {
                await supabase.auth.signOut();
                updateUIForLogout();
                showNotification('Logged out successfully!');
            });
            
            // Add player form
            addPlayerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const playerName = document.getElementById('newPlayerName').value.trim();
                const tier = document.getElementById('newPlayerTier').value;
                
                if (!playerName || !tier) {
                    showNotification('Please fill in all fields', 'error');
                    return;
                }
                
                await addPlayer(playerName, tier);
                addPlayerForm.reset();
            });
            
            // Edit player form
            editPlayerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const playerId = editPlayerId.value;
                const tier = editPlayerTier.value;
                
                if (!playerId || !tier) {
                    showNotification('Please select a tier', 'error');
                    return;
                }
                
                await updatePlayer(playerId, tier);
                editPlayerModal.classList.remove('active');
            });
            
            // Delete player button
            deletePlayerBtn.addEventListener('click', async () => {
                const playerId = editPlayerId.value;
                
                if (!playerId) return;
                
                if (confirm('Are you sure you want to delete this player?')) {
                    await deletePlayer(playerId);
                    editPlayerModal.classList.remove('active');
                }
            });
            
            // Close edit modal
            closeEditModal.addEventListener('click', () => {
                editPlayerModal.classList.remove('active');
            });
            
            // Search functionality
            playerSearch.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                
                if (searchTerm === '') {
                    filteredData = [...leaderboardData];
                } else {
                    filteredData = leaderboardData.filter(player => 
                        player.playerName.toLowerCase().includes(searchTerm)
                    );
                }
                
                renderLeaderboard();
            });
            
            // Close modals when clicking outside
            window.addEventListener('click', (e) => {
                if (e.target === loginModal) {
                    loginModal.classList.remove('active');
                }
                if (e.target === editPlayerModal) {
                    editPlayerModal.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
