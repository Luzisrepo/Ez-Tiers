<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ Tiers - Staff Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.86/build/spline-viewer.js"></script>
    <style>
        :root {
            --primary-accent: #7c3aed;
            --dark-bg: #0f0f1a;
            --darker-bg: #090912;
            --card-bg: rgba(30, 30, 46, 0.7);
            --card-border: rgba(124, 58, 237, 0.2);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --success: #10b981;
            --error: #ef4444;
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--darker-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .spline-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-top: 2rem;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #7c3aed, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(124, 58, 237, 0.3);
            }
            to {
                text-shadow: 0 0 20px rgba(124, 58, 237, 0.5), 0 0 30px rgba(124, 58, 237, 0.3);
            }
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .panels-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }

        .panel {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 2rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            transition: var(--transition);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        .panel:nth-child(2) {
            animation-delay: 0.6s;
        }

        .panel:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(124, 58, 237, 0.4);
        }

        .panel-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(124, 58, 237, 0.2);
        }

        .panel-title {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #7c3aed, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.2rem;
            animation: fadeIn 0.6s ease-out both;
        }

        .form-group:nth-child(1) { animation-delay: 0.5s; }
        .form-group:nth-child(2) { animation-delay: 0.6s; }
        .form-group:nth-child(3) { animation-delay: 0.7s; }
        .form-group:nth-child(4) { animation-delay: 0.8s; }
        .form-group:nth-child(5) { animation-delay: 0.9s; }
        .form-group:nth-child(6) { animation-delay: 1.0s; }
        .form-group:nth-child(7) { animation-delay: 1.1s; }
        .form-group:nth-child(8) { animation-delay: 1.2s; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 10px;
            border: 1px solid rgba(124, 58, 237, 0.2);
            background: rgba(15, 15, 26, 0.5);
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
        }

        input:focus, select:focus {
            outline: none;
            border-color: rgba(124, 58, 237, 0.5);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
            background: rgba(15, 15, 26, 0.7);
        }

        .submit-btn {
            background: linear-gradient(45deg, var(--primary-accent), #8b5cf6);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            margin-top: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
            animation: fadeIn 0.6s ease-out 1.3s both;
        }

        .submit-btn:hover {
            background: linear-gradient(45deg, #8b5cf6, var(--primary-accent));
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .confirmation {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-top: 1.5rem;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition);
            color: var(--success);
            backdrop-filter: blur(10px);
        }

        .confirmation.show {
            opacity: 1;
            transform: translateY(0);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            animation: fadeIn 0.6s ease-out 1.4s both;
        }

        @media (max-width: 768px) {
            .panels-container {
                flex-direction: column;
                align-items: center;
            }
            
            .panel {
                width: 100%;
            }
            
            .logo {
                font-size: 2.5rem;
            }
            
            .container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <spline-viewer class="spline-background" url="https://prod.spline.design/Hd4ZJvNLOCUfhUy2/scene.splinecode"></spline-viewer>
    
    <div class="container">
        <header>
            <h1 class="logo">EZ Tiers</h1>
            <p class="subtitle">Staff Panel - Tier Testing Results</p>
        </header>
        
        <div class="panels-container">
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Normal Results</h2>
                </div>
                <form id="normal-form">
                    <div class="form-group">
                        <label for="normal-examinee">Examinee</label>
                        <input type="text" id="normal-examinee" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="normal-tester">Tester</label>
                        <input type="text" id="normal-tester" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="normal-gamemode">Gamemode</label>
                        <select id="normal-gamemode" required>
                            <option value="">Select Gamemode</option>
                            <option value="Sword">Sword</option>
                            <option value="Axe">Axe</option>
                            <option value="BedWars">Bedwars</option>
                            <option value="UHC">UHC</option>
                            <option value="Nethpot">Nethpot</option>
                            <option value="DiaPot">Diapot</option>
                            <option value="SMP">SMP</option>
                            <option value="DiaSMP">Dia SMP</option>
                            <option value="Bridge">Bridge</option>
                            <option value="Sumo">Sumo</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="normal-tier-tested">Tier Tested For</label>
                        <input type="text" id="normal-tier-tested" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="normal-previous-tier">Previous Tier</label>
                        <input type="text" id="normal-previous-tier" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="normal-score">Score</label>
                        <input type="text" id="normal-score" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="normal-result">Result</label>
                        <select id="normal-result" required>
                            <option value="">Select Result</option>
                            <option value="Passed">Passed</option>
                            <option value="Failed">Failed</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="normal-recording">Recording Link</label>
                        <input type="url" id="normal-recording" required>
                    </div>
                    
                    <button type="submit" class="submit-btn">Submit Normal Results</button>
                    
                    <div class="confirmation" id="normal-confirmation">
                        Results submitted successfully!
                    </div>
                </form>
            </div>
            
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">High Results</h2>
                </div>
                <form id="high-form">
                    <div class="form-group">
                        <label for="high-examinee">Examinee</label>
                        <input type="text" id="high-examinee" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="high-tester">Tester</label>
                        <input type="text" id="high-tester" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="high-gamemode">Gamemode</label>
                        <select id="high-gamemode" required>
                            <option value="">Select Gamemode</option>
                            <option value="BedWars">BedWars</option>
                            <option value="SkyWars">SkyWars</option>
                            <option value="Duels">Duels</option>
                            <option value="UHC">UHC</option>
                            <option value="MegaWalls">MegaWalls</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="high-tier-tested">Tier Tested For</label>
                        <input type="text" id="high-tier-tested" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="high-previous-tier">Previous Tier</label>
                        <input type="text" id="high-previous-tier" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="high-score">Score</label>
                        <input type="text" id="high-score" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="high-result">Result</label>
                        <select id="high-result" required>
                            <option value="">Select Result</option>
                            <option value="Passed">Passed</option>
                            <option value="Failed">Failed</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="high-recording">Recording Link</label>
                        <input type="url" id="high-recording" required>
                    </div>
                    
                    <button type="submit" class="submit-btn">Submit High Results</button>
                    
                    <div class="confirmation" id="high-confirmation">
                        Results submitted successfully!
                    </div>
                </form>
            </div>
        </div>
        
        <footer>
            <p>EZ Tiers Staff Panel &copy; 2025 | For authorized personnel only</p>
        </footer>
    </div>

    <script>
        // Webhook URLs
        const NORMAL_WEBHOOK = "https://discord.com/api/webhooks/1431766991542161591/3NsdQAcPxgO6xP5y_AD9FW6rWB1aMP3z3a577AqFShOiKYOYni26jyw6R9aA5YtWP4jG";
        const HIGH_WEBHOOK = "https://discord.com/api/webhooks/1431767143871156227/7_4cmtZ0NgRsHa9Mqgbx8-3wExrqK104z-AFQKWBySlV31IMoHCYrt4mth3K61pX5FhN";
        
        // Form submission handlers
        document.getElementById('normal-form').addEventListener('submit', function(e) {
            e.preventDefault();
            submitForm('normal', this);
        });
        
        document.getElementById('high-form').addEventListener('submit', function(e) {
            e.preventDefault();
            submitForm('high', this);
        });
        
        function submitForm(type, form) {
            const formData = new FormData(form);
            const data = {};
            
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }
            
            // Get all form values
            const examinee = document.getElementById(`${type}-examinee`).value;
            const tester = document.getElementById(`${type}-tester`).value;
            const gamemode = document.getElementById(`${type}-gamemode`).value;
            const tierTested = document.getElementById(`${type}-tier-tested`).value;
            const previousTier = document.getElementById(`${type}-previous-tier`).value;
            const score = document.getElementById(`${type}-score`).value;
            const result = document.getElementById(`${type}-result`).value;
            const recording = document.getElementById(`${type}-recording`).value;
            
            // Determine color based on result
            const color = result === 'Passed' ? 3066993 : 15158332; // Green for passed, red for failed
            
            // Create Discord embed
            const embed = {
                title: `Tier Test ${result} - ${gamemode}`,
                color: color,
                fields: [
                    {
                        name: "Examinee",
                        value: examinee,
                        inline: true
                    },
                    {
                        name: "Tester",
                        value: tester,
                        inline: true
                    },
                    {
                        name: "Gamemode",
                        value: gamemode,
                        inline: true
                    },
                    {
                        name: "Tier Tested For",
                        value: tierTested,
                        inline: true
                    },
                    {
                        name: "Previous Tier",
                        value: previousTier,
                        inline: true
                    },
                    {
                        name: "Score",
                        value: score,
                        inline: true
                    },
                    {
                        name: "Result",
                        value: result,
                        inline: true
                    },
                    {
                        name: "Recording",
                        value: `[View Recording](${recording})`,
                        inline: false
                    }
                ],
                timestamp: new Date().toISOString(),
                footer: {
                    text: `EZ Tiers ${type.charAt(0).toUpperCase() + type.slice(1)} Results`
                }
            };
            
            // Send to Discord webhook
            const webhookURL = type === 'normal' ? NORMAL_WEBHOOK : HIGH_WEBHOOK;
            
            fetch(webhookURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    embeds: [embed]
                })
            })
            .then(response => {
                if (response.ok) {
                    // Show confirmation message
                    const confirmation = document.getElementById(`${type}-confirmation`);
                    confirmation.classList.add('show');
                    
                    // Reset form
                    form.reset();
                    
                    // Hide confirmation after 3 seconds
                    setTimeout(() => {
                        confirmation.classList.remove('show');
                    }, 3000);
                } else {
                    alert('Error submitting results. Please try again.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error submitting results. Please try again.');
            });
        }
    </script>
</body>
</html>
