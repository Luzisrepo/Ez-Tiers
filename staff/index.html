<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EZ Tiers - Staff Panel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.86/build/spline-viewer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-accent: #7c3aed;
      --dark-bg: #0f0f1a;
      --darker-bg: #090912;
      --card-bg: rgba(30, 30, 46, 0.7);
      --card-border: rgba(124, 58, 237, 0.2);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --success: #10b981;
      --error: #ef4444;
      --border-radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--darker-bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .spline-background {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1; opacity: 0.9;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      animation: slideUp 0.8s ease-out 0.2s both;
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    header { text-align: center; margin-bottom: 3rem; padding-top: 2rem; }
    .logo {
      font-size: 3.5rem; font-weight: 800;
      background: linear-gradient(45deg, #7c3aed, #8b5cf6, #a78bfa);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
      animation: glow 3s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px rgba(124, 58, 237, 0.3); }
      to { text-shadow: 0 0 20px rgba(124, 58, 237, 0.5), 0 0 30px rgba(124, 58, 237, 0.3); }
    }

    .subtitle { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem; }
    .panels-container { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; }

    .panel {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 2rem;
      width: 100%; max-width: 550px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      transition: var(--transition);
      backdrop-filter: blur(12px);
    }

    .panel:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      border-color: rgba(124,58,237,0.4);
    }

    .panel-header {
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(124,58,237,0.2);
    }

    .panel-title {
      font-size: 1.8rem;
      background: linear-gradient(45deg, #7c3aed, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
    }

    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); }
    input, select {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border-radius: 10px;
      border: 1px solid rgba(124,58,237,0.2);
      background: rgba(15,15,26,0.5);
      color: var(--text-primary);
      font-size: 1rem;
    }

    .submit-btn {
      background: linear-gradient(45deg, var(--primary-accent), #8b5cf6);
      color: white;
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(124,58,237,0.3);
    }

    .confirmation {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: var(--border-radius);
      padding: 1rem;
      margin-top: 1.5rem;
      text-align: center;
      color: var(--success);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(10px);
      transition: var(--transition);
    }
    .confirmation.show { opacity: 1; transform: translateY(0); }

    /* Login Modal Styles */
    .login-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 9, 18, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .login-container {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 2.5rem;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid var(--card-border);
      text-align: center;
      animation: modalSlideIn 0.5s ease-out forwards;
    }

    @keyframes modalSlideIn {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(45deg, #7c3aed, #8b5cf6, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }

    .login-title {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }

    .login-form {
      margin-top: 1.5rem;
    }

    .login-btn {
      background: linear-gradient(45deg, var(--primary-accent), #8b5cf6);
      color: white;
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(124,58,237,0.3);
      transition: var(--transition);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124,58,237,0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      padding: 0.8rem;
      margin-top: 1rem;
      text-align: center;
      color: var(--error);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(10px);
      transition: var(--transition);
    }

    .error-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden {
      display: none;
    }

    .user-info {
      position: absolute;
      top: 2rem;
      right: 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--primary-accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }

    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(124,58,237,0.2);
    }
  </style>
</head>
<body>
  <spline-viewer class="spline-background" url="https://prod.spline.design/Hd4ZJvNLOCUfhUy2/scene.splinecode"></spline-viewer>

  <!-- Login Modal -->
  <div class="login-modal" id="login-modal">
    <div class="login-container">
      <h1 class="login-logo">EZ Tiers</h1>
      <h2 class="login-title">Staff Login</h2>
      <form class="login-form" id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="login-btn">Login</button>
        <div class="error-message" id="login-error">Invalid credentials. Please try again.</div>
      </form>
    </div>
  </div>

  <!-- Main Content (Hidden until logged in) -->
  <div class="container hidden" id="main-content">
    <div class="user-info" id="user-info">
      <div class="user-avatar" id="user-avatar">U</div>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
    
    <header>
      <h1 class="logo">EZ Tiers</h1>
      <p class="subtitle">Staff Panel - Tier Testing Results</p>
    </header>

    <div class="panels-container">
      <!-- Normal Results -->
      <div class="panel">
        <div class="panel-header"><h2 class="panel-title">Normal Results</h2></div>
        <form id="normal-form">
          <div class="form-group"><label>Tester</label><input type="text" id="normal-tester" required></div>

          <div class="form-group">
            <label>Region</label>
            <select id="normal-region" required>
              <option value="">Select Region</option>
              <option value="AS">AS</option>
              <option value="EU">EU</option>
              <option value="NA">NA</option>
            </select>
          </div>

          <div class="form-group"><label>Username</label><input type="text" id="normal-username" required></div>

          <div class="form-group">
            <label>Previous Tier</label>
            <select id="normal-previous-tier" required>
              <option value="">Select Previous Tier</option>
              <option>LT5</option><option>HT5</option>
              <option>LT4</option><option>HT4</option>
              <option>LT3</option><option>HT3</option>
              <option>LT2</option><option>HT2</option>
              <option>LT1</option><option>HT1</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tier Given</label>
            <select id="normal-tier-given" required>
              <option value="">Select Tier Given</option>
              <option>LT5</option><option>HT5</option>
              <option>LT4</option><option>HT4</option>
              <option>LT3</option><option>HT3</option>
              <option>LT2</option><option>HT2</option>
              <option>LT1</option><option>HT1</option>
            </select>
          </div>

          <div class="form-group">
            <label>Gamemode</label>
            <select id="normal-gamemode" required>
              <option value="">Select Gamemode</option>
              <option value="Sword">Sword</option>
              <option value="Axe">Axe</option>
              <option value="BedWars">Bedwars</option>
              <option value="UHC">UHC</option>
              <option value="Nethpot">Nethpot</option>
              <option value="DiaPot">Diapot</option>
              <option value="SMP">SMP</option>
              <option value="DiaSMP">Dia SMP</option>
              <option value="Bridge">Bridge</option>
              <option value="Sumo">Sumo</option>
            </select>
          </div>

          <button type="submit" class="submit-btn">Submit Normal Results</button>
          <div class="confirmation" id="normal-confirmation">Results submitted successfully!</div>
        </form>
      </div>

      <!-- High Results -->
      <div class="panel">
        <div class="panel-header"><h2 class="panel-title">High Results</h2></div>
        <form id="high-form">
          <div class="form-group"><label>Tester</label><input type="text" id="high-tester" required></div>

          <div class="form-group">
            <label>Region</label>
            <select id="high-region" required>
              <option value="">Select Region</option>
              <option value="AS">AS</option>
              <option value="EU">EU</option>
              <option value="NA">NA</option>
            </select>
          </div>

          <div class="form-group"><label>Username</label><input type="text" id="high-username" required></div>

          <div class="form-group">
            <label>Previous Tier</label>
            <select id="high-previous-tier" required>
              <option value="">Select Previous Tier</option>
              <option>LT5</option><option>HT5</option>
              <option>LT4</option><option>HT4</option>
              <option>LT3</option><option>HT3</option>
              <option>LT2</option><option>HT2</option>
              <option>LT1</option><option>HT1</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tier Given</label>
            <select id="high-tier-given" required>
              <option value="">Select Tier Given</option>
              <option>LT5</option><option>HT5</option>
              <option>LT4</option><option>HT4</option>
              <option>LT3</option><option>HT3</option>
              <option>LT2</option><option>HT2</option>
              <option>LT1</option><option>HT1</option>
            </select>
          </div>

          <div class="form-group">
            <label>Gamemode</label>
            <select id="high-gamemode" required>
              <option value="">Select Gamemode</option>
              <option value="Sword">Sword</option>
              <option value="Axe">Axe</option>
              <option value="BedWars">Bedwars</option>
              <option value="UHC">UHC</option>
              <option value="Nethpot">Nethpot</option>
              <option value="DiaPot">Diapot</option>
              <option value="SMP">SMP</option>
              <option value="DiaSMP">Dia SMP</option>
              <option value="Bridge">Bridge</option>
              <option value="Sumo">Sumo</option>
<option value="CrystalPVP">Crystal PVP</option>
            </select>
          </div>

          <button type="submit" class="submit-btn">Submit High Results</button>
          <div class="confirmation" id="high-confirmation">Results submitted successfully!</div>
        </form>
      </div>
    </div>
    <footer><p>EZ Tiers Staff Panel &copy; 2025 | For authorized personnel only</p></footer>
  </div>

  <script>
    // Supabase configuration
    const supabaseUrl = 'https://dkfimhcwiufignzfqnxm.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrZmltaGN3aXVmaWduemZxbnhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5OTc3MjQsImV4cCI6MjA3NDU3MzcyNH0.lOtCk4v3fkd1DJfvpqrv-NgyByNhEsaHeL4GEqGrQa8';
    
    // Initialize Supabase client
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    
    // Discord webhooks
    const NORMAL_WEBHOOK = "https://discord.com/api/webhooks/1431766991542161591/3NsdQAcPxgO6xP5y_AD9FW6rWB1aMP3z3a577AqFShOiKYOYni26jyw6R9aA5YtWP4jG";
    const HIGH_WEBHOOK = "https://discord.com/api/webhooks/1431767143871156227/7_4cmtZ0NgRsHa9Mqgbx8-3wExrqK104z-AFQKWBySlV31IMoHCYrt4mth3K61pX5FhN";

    // DOM elements
    const loginModal = document.getElementById('login-modal');
    const mainContent = document.getElementById('main-content');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');
    const userAvatar = document.getElementById('user-avatar');

    // Check if user is already logged in
    async function checkAuthStatus() {
      const { data: { session } } = await supabase.auth.getSession();
      
      if (session) {
        // User is logged in, show main content
        showMainContent(session.user);
      } else {
        // No session, show login modal
        loginModal.classList.remove('hidden');
      }
    }

    // Handle login form submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      
      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });
      
      if (error) {
        // Show error message
        loginError.classList.add('show');
        setTimeout(() => {
          loginError.classList.remove('show');
        }, 3000);
      } else {
        // Login successful
        showMainContent(data.user);
      }
    });

    // Handle logout
    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
      mainContent.classList.add('hidden');
      loginModal.classList.remove('hidden');
      loginForm.reset();
    });

    // Show main content after successful login
    function showMainContent(user) {
      // Set user avatar initial
      if (user.email) {
        userAvatar.textContent = user.email.charAt(0).toUpperCase();
      }
      
      loginModal.classList.add('hidden');
      mainContent.classList.remove('hidden');
    }

    // Check auth status on page load
    document.addEventListener('DOMContentLoaded', () => {
      checkAuthStatus();
    });

    // Form submission handlers
    document.getElementById("normal-form").addEventListener("submit", e => { e.preventDefault(); submitForm("normal"); });
    document.getElementById("high-form").addEventListener("submit", e => { e.preventDefault(); submitForm("high"); });

    function submitForm(type) {
      const tester = document.getElementById(`${type}-tester`).value;
      const region = document.getElementById(`${type}-region`).value;
      const username = document.getElementById(`${type}-username`).value;
      const previousTier = document.getElementById(`${type}-previous-tier`).value;
      const tierGiven = document.getElementById(`${type}-tier-given`).value;
      const gamemode = document.getElementById(`${type}-gamemode`).value;

      const playerRender = `https://mc-heads.net/avatar/${encodeURIComponent(username)}`;

      const embed = {
        color: 16172079,
        timestamp: new Date().toISOString(),
        url: "https://ez-tiers.vercel.app/",
        author: {
          url: "https://ez-tiers.vercel.app/",
          icon_url: "https://github.com/Luzisrepo/Ez-Tiers/blob/main/Assets/Tiers.png?raw=true",
          name: "Ez Tiers"
        },
        footer: {
          icon_url: "https://github.com/Luzisrepo/Ez-Tiers/blob/main/Assets/Tiers.png?raw=true",
          text: "Made by ._rayzz"
        },
        fields: [
          { name: "Tester", value: tester, inline: false },
          { name: "Region", value: region, inline: false },
          { name: "Username", value: username, inline: false },
          { name: "Previous Tier", value: previousTier, inline: true },
          { name: "Tier Given", value: tierGiven, inline: true },
          { name: "Gamemode", value: gamemode, inline: true }
        ],
        image: { url: "https://github.com/Luzisrepo/Ez-Tiers/blob/main/Assets/Banner.png?raw=true" },
        title: "Tier Test Result",
        thumbnail: { url: playerRender }
      };

      const webhook = type === "normal" ? NORMAL_WEBHOOK : HIGH_WEBHOOK;

      fetch(webhook, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ embeds: [embed] })
      })
      .then(res => {
        if (res.ok) {
          const conf = document.getElementById(`${type}-confirmation`);
          conf.classList.add("show");
          document.getElementById(`${type}-form`).reset();
          setTimeout(() => conf.classList.remove("show"), 3000);
        } else alert("Error submitting results.");
      })
      .catch(() => alert("Error submitting results."));
    }
  </script>
</body>
</html>
