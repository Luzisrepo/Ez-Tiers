<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EZ Tiers - Staff Panel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.86/build/spline-viewer.js"></script>
  <style>
    :root {
      --primary-accent: #7c3aed;
      --dark-bg: #0f0f1a;
      --darker-bg: #090912;
      --card-bg: rgba(30, 30, 46, 0.7);
      --card-border: rgba(124, 58, 237, 0.2);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --success: #10b981;
      --border-radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--darker-bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .spline-background {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1; opacity: 0.9;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      animation: slideUp 0.8s ease-out 0.2s both;
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    header { text-align: center; margin-bottom: 3rem; padding-top: 2rem; }
    .logo {
      font-size: 3.5rem; font-weight: 800;
      background: linear-gradient(45deg, #7c3aed, #8b5cf6, #a78bfa);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
      animation: glow 3s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px rgba(124, 58, 237, 0.3); }
      to { text-shadow: 0 0 20px rgba(124, 58, 237, 0.5), 0 0 30px rgba(124, 58, 237, 0.3); }
    }

    .subtitle { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem; }
    .panels-container { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; }

    .panel {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 2rem;
      width: 100%; max-width: 550px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      transition: var(--transition);
      backdrop-filter: blur(12px);
    }

    .panel:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      border-color: rgba(124,58,237,0.4);
    }

    .panel-header {
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(124,58,237,0.2);
    }

    .panel-title {
      font-size: 1.8rem;
      background: linear-gradient(45deg, #7c3aed, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
    }

    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); }
    input, select {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border-radius: 10px;
      border: 1px solid rgba(124,58,237,0.2);
      background: rgba(15,15,26,0.5);
      color: var(--text-primary);
      font-size: 1rem;
    }

    .submit-btn {
      background: linear-gradient(45deg, var(--primary-accent), #8b5cf6);
      color: white;
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(124,58,237,0.3);
    }

    .confirmation {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: var(--border-radius);
      padding: 1rem;
      margin-top: 1.5rem;
      text-align: center;
      color: var(--success);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(10px);
      transition: var(--transition);
    }
    .confirmation.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <spline-viewer class="spline-background" url="https://prod.spline.design/Hd4ZJvNLOCUfhUy2/scene.splinecode"></spline-viewer>

  <div class="container">
    <header>
      <h1 class="logo">EZ Tiers</h1>
      <p class="subtitle">Staff Panel - Tier Testing Results</p>
    </header>

    <div class="panels-container">
      <!-- Normal Results -->
      <div class="panel">
        <div class="panel-header"><h2 class="panel-title">Normal Results</h2></div>
        <form id="normal-form">
          <div class="form-group"><label>Tester</label><input type="text" id="normal-tester" required></div>

          <div class="form-group">
            <label>Region</label>
            <select id="normal-region" required>
              <option value="">Select Region</option>
              <option value="AS">AS</option>
              <option value="EU">EU</option>
              <option value="NA">NA</option>
            </select>
          </div>

          <div class="form-group"><label>Username</label><input type="text" id="normal-username" required></div>

          <div class="form-group">
            <label>Previous Tier</label>
            <select id="normal-previous-tier" required>
              <option value="">Select Previous Tier</option>
              <option>LT5</option><option>HT5</option>
              <option>LT4</option><option>HT4</option>
              <option>LT3</option><option>HT3</option>
              <option>LT2</option><option>HT2</option>
              <option>LT1</option><option>HT1</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tier Given</label>
            <select id="normal-tier-given" required>
              <option value="">Select Tier Given</option>
              <option>LT5</option><option>HT5</option>
              <option>LT4</option><option>HT4</option>
              <option>LT3</option><option>HT3</option>
              <option>LT2</option><option>HT2</option>
              <option>LT1</option><option>HT1</option>
            </select>
          </div>

          <div class="form-group">
            <label>Gamemode</label>
            <select id="normal-gamemode" required>
              <option value="">Select Gamemode</option>
              <option value="Sword">Sword</option>
              <option value="Axe">Axe</option>
              <option value="BedWars">Bedwars</option>
              <option value="UHC">UHC</option>
              <option value="Nethpot">Nethpot</option>
              <option value="DiaPot">Diapot</option>
              <option value="SMP">SMP</option>
              <option value="DiaSMP">Dia SMP</option>
              <option value="Bridge">Bridge</option>
              <option value="Sumo">Sumo</option>
            </select>
          </div>

          <button type="submit" class="submit-btn">Submit Normal Results</button>
          <div class="confirmation" id="normal-confirmation">Results submitted successfully!</div>
        </form>
      </div>

      <!-- High Results -->
      <div class="panel">
        <div class="panel-header"><h2 class="panel-title">High Results</h2></div>
        <form id="high-form">
          <div class="form-group"><label>Tester</label><input type="text" id="high-tester" required></div>

          <div class="form-group">
            <label>Region</label>
            <select id="high-region" required>
              <option value="">Select Region</option>
              <option value="AS">AS</option>
              <option value="EU">EU</option>
              <option value="NA">NA</option>
            </select>
          </div>

          <div class="form-group"><label>Username</label><input type="text" id="high-username" required></div>

          <div class="form-group">
            <label>Previous Tier</label>
            <select id="high-previous-tier" required>
              <option value="">Select Previous Tier</option>
              <option>LT5</option><option>HT5</option>
              <option>LT4</option><option>HT4</option>
              <option>LT3</option><option>HT3</option>
              <option>LT2</option><option>HT2</option>
              <option>LT1</option><option>HT1</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tier Given</label>
            <select id="high-tier-given" required>
              <option value="">Select Tier Given</option>
              <option>LT5</option><option>HT5</option>
              <option>LT4</option><option>HT4</option>
              <option>LT3</option><option>HT3</option>
              <option>LT2</option><option>HT2</option>
              <option>LT1</option><option>HT1</option>
            </select>
          </div>

          <div class="form-group">
            <label>Gamemode</label>
            <select id="high-gamemode" required>
              <option value="">Select Gamemode</option>
              <option value="Sword">Sword</option>
              <option value="Axe">Axe</option>
              <option value="BedWars">Bedwars</option>
              <option value="UHC">UHC</option>
              <option value="Nethpot">Nethpot</option>
              <option value="DiaPot">Diapot</option>
              <option value="SMP">SMP</option>
              <option value="DiaSMP">Dia SMP</option>
              <option value="Bridge">Bridge</option>
              <option value="Sumo">Sumo</option>
            </select>
          </div>

          <button type="submit" class="submit-btn">Submit High Results</button>
          <div class="confirmation" id="high-confirmation">Results submitted successfully!</div>
        </form>
      </div>
    </div>
    <footer><p>EZ Tiers Staff Panel &copy; 2025 | For authorized personnel only</p></footer>
  </div>

  <script>
    const NORMAL_WEBHOOK = "https://discord.com/api/webhooks/1431766991542161591/3NsdQAcPxgO6xP5y_AD9FW6rWB1aMP3z3a577AqFShOiKYOYni26jyw6R9aA5YtWP4jG";
    const HIGH_WEBHOOK = "https://discord.com/api/webhooks/1431767143871156227/7_4cmtZ0NgRsHa9Mqgbx8-3wExrqK104z-AFQKWBySlV31IMoHCYrt4mth3K61pX5FhN";

    document.getElementById("normal-form").addEventListener("submit", e => { e.preventDefault(); submitForm("normal"); });
    document.getElementById("high-form").addEventListener("submit", e => { e.preventDefault(); submitForm("high"); });

    function submitForm(type) {
      const tester = document.getElementById(`${type}-tester`).value;
      const region = document.getElementById(`${type}-region`).value;
      const username = document.getElementById(`${type}-username`).value;
      const previousTier = document.getElementById(`${type}-previous-tier`).value;
      const tierGiven = document.getElementById(`${type}-tier-given`).value;
      const gamemode = document.getElementById(`${type}-gamemode`).value;

      const playerRender = `https://mc-heads.net/avatar/${encodeURIComponent(username)}`;

      const embed = {
        color: 16172079,
        timestamp: new Date().toISOString(),
        url: "https://ez-tiers.vercel.app/",
        author: {
          url: "https://ez-tiers.vercel.app/",
          icon_url: "https://github.com/Luzisrepo/Ez-Tiers/blob/main/Assets/Tiers.png?raw=true",
          name: "Ez Tiers"
        },
        footer: {
          icon_url: "https://github.com/Luzisrepo/Ez-Tiers/blob/main/Assets/Tiers.png?raw=true",
          text: "Made by ._rayzz"
        },
        fields: [
          { name: "Tester", value: tester, inline: false },
          { name: "Region", value: region, inline: false },
          { name: "Username", value: username, inline: false },
          { name: "Previous Tier", value: previousTier, inline: true },
          { name: "Tier Given", value: tierGiven, inline: true },
          { name: "Gamemode", value: gamemode, inline: true }
        ],
        image: { url: "https://github.com/Luzisrepo/Ez-Tiers/blob/main/Assets/Banner.png?raw=true" },
        title: "Tier Test Result",
        thumbnail: { url: playerRender }
      };

      const webhook = type === "normal" ? NORMAL_WEBHOOK : HIGH_WEBHOOK;

      fetch(webhook, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ embeds: [embed] })
      })
      .then(res => {
        if (res.ok) {
          const conf = document.getElementById(`${type}-confirmation`);
          conf.classList.add("show");
          document.getElementById(`${type}-form`).reset();
          setTimeout(() => conf.classList.remove("show"), 3000);
        } else alert("Error submitting results.");
      })
      .catch(() => alert("Error submitting results."));
    }
  </script>
</body>
</html>
